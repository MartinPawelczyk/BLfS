# Runs the test suite on every push. The grade is computed with grading/grade.py locally;
# this workflow only tells you which tests pass.
name: tests
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install numpy regex einops jaxtyping pytest
      - run: python -m pytest -q tests/
